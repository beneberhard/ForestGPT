# docker-compose.yml
services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: forestgpt_postgis
    environment:
      POSTGRES_DB: forestgpt
      POSTGRES_USER: forestgpt_user
      POSTGRES_PASSWORD: forestgpt_password
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - forestgpt_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forestgpt_user -d forestgpt"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: forestgpt_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://forestgpt_user:forestgpt_password@db:5432/forestgpt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1024}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SIMULATION_ADAPTER: ${SIMULATION_ADAPTER:-r3pg}
      MODEL_CACHE_DIR: /app/.cache/llama_index
      APP_PORT: 8005
    ports:
      - "${APP_HOST_PORT:-8005}:8005"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - forestgpt_model_cache:/app/.cache

volumes:
  forestgpt_postgis_data:
  forestgpt_model_cache:

  
